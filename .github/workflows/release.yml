name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify frontend
        run: cd web && npm ci && npm run verify
      - name: Derive release verification key
        env:
          NET_PROBE_RELEASE_SIGNING_KEY_B64: ${{ secrets.NET_PROBE_RELEASE_SIGNING_KEY_B64 }}
        run: echo "RELEASE_PUBLIC_KEY_HEX=$(go run ./cmd/net-probe-release -print-public-key)" >> "$GITHUB_ENV"
      - name: Build agent linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.releasePublicKeyHex=${RELEASE_PUBLIC_KEY_HEX}" -o net-probe_linux_amd64 ./cmd/net-probe
      - name: Build agent linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.releasePublicKeyHex=${RELEASE_PUBLIC_KEY_HEX}" -o net-probe_linux_arm64 ./cmd/net-probe
      - name: Build panel linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.releasePublicKeyHex=${RELEASE_PUBLIC_KEY_HEX}" -o net-probe-panel_linux_amd64 ./cmd/net-probe-panel
      - name: Build panel linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.releasePublicKeyHex=${RELEASE_PUBLIC_KEY_HEX}" -o net-probe-panel_linux_arm64 ./cmd/net-probe-panel
      - name: Sign agent manifests
        env:
          NET_PROBE_RELEASE_SIGNING_KEY_B64: ${{ secrets.NET_PROBE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          go run ./cmd/net-probe-release -artifact net-probe_linux_amd64 -version "$GITHUB_REF_NAME" -os linux -arch amd64 -url "https://github.com/s2005lg/net-probe/releases/download/${GITHUB_REF_NAME}/net-probe_linux_amd64" -minimum-panel "$GITHUB_REF_NAME" -manifest net-probe_linux_amd64.manifest.json -signature net-probe_linux_amd64.manifest.sig
          go run ./cmd/net-probe-release -artifact net-probe_linux_arm64 -version "$GITHUB_REF_NAME" -os linux -arch arm64 -url "https://github.com/s2005lg/net-probe/releases/download/${GITHUB_REF_NAME}/net-probe_linux_arm64" -minimum-panel "$GITHUB_REF_NAME" -manifest net-probe_linux_arm64.manifest.json -signature net-probe_linux_arm64.manifest.sig
      - name: Generate checksums
        run: |
          sha256sum net-probe_linux_amd64 net-probe_linux_arm64 net-probe-panel_linux_amd64 net-probe-panel_linux_arm64 > SHA256SUMS
          sha256sum net-probe_linux_amd64.manifest.json net-probe_linux_amd64.manifest.sig net-probe_linux_arm64.manifest.json net-probe_linux_arm64.manifest.sig >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            net-probe_linux_amd64
            net-probe_linux_arm64
            net-probe-panel_linux_amd64
            net-probe-panel_linux_arm64
            net-probe_linux_amd64.manifest.json
            net-probe_linux_amd64.manifest.sig
            net-probe_linux_arm64.manifest.json
            net-probe_linux_arm64.manifest.sig
            SHA256SUMS
